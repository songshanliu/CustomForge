<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CustomForge package consumer</title>
  </head>
  <body>
    <main class="consumer-shell">
      <header class="consumer-toolbar">
        <strong>CustomForge package consumer</strong>
        <span id="status" role="status">Starting</span>
        <button id="add-text" type="button">Add text</button>
        <button id="add-image" type="button">Add image</button>
        <button id="reset-view" type="button">Reset view</button>
        <button id="export" type="button">Export PNG</button>
        <button id="destroy" type="button">Destroy</button>
      </header>
      <form class="consumer-source" id="remote-product">
        <label>
          <span>GLB / GLTF URL</span>
          <input id="model-url" type="url" placeholder="https://example.com/product.glb" required />
        </label>
        <label>
          <span>Customizable mesh</span>
          <input id="mesh-name" type="text" value="PrintArea" required />
        </label>
        <label class="consumer-check">
          <input id="flip-texture" type="checkbox" />
          <span>Flip texture vertically</span>
        </label>
        <button type="submit">Load remote</button>
        <button id="use-demo" type="button">Use built-in demo</button>
      </form>
      <section class="consumer-workbench">
        <div id="editor"></div>
        <div id="viewer"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
